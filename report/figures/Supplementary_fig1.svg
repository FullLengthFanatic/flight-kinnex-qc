<svg class="schematic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" role="img" aria-label="How one skera false cut breaks two molecules"><style>.svglabel{font:600 13px 'IBM Plex Sans',Arial,sans-serif;fill:#1B1F24}.svgsmall{font:12px 'IBM Plex Sans',Arial,sans-serif;fill:#5B636E}.svgadapter{font:600 11px 'IBM Plex Sans',Arial,sans-serif;fill:#FFFFFF}.svgpanel{font:600 14px 'IBM Plex Sans',Arial,sans-serif;fill:#1B1F24}</style><text x="10" y="16" class="svglabel">The read with our adapters and primers; vertical lines: where skera cuts</text><rect x="40" y="38" width="14" height="26" rx="2" fill="#2B333B"/><text x="47" y="55" text-anchor="middle" class="svgadapter">C</text><rect x="56" y="40" width="300" height="22" rx="3" fill="#E2E7EC" stroke="#A7B1BB"/><rect x="58" y="42" width="34" height="18" rx="2" fill="#5E6A76"/><text x="75" y="55" text-anchor="middle" class="svgadapter">R1</text><rect x="318" y="42" width="36" height="18" rx="2" fill="#7A8691"/><text x="336" y="55" text-anchor="middle" class="svgadapter">TSO</text><text x="206.0" y="55" text-anchor="middle" class="svgsmall">slot C to D</text><rect x="358" y="38" width="14" height="26" rx="2" fill="#2B333B"/><text x="365" y="55" text-anchor="middle" class="svgadapter">D</text><rect x="374" y="40" width="300" height="22" rx="3" fill="#E2E7EC" stroke="#A7B1BB"/><rect x="376" y="42" width="34" height="18" rx="2" fill="#5E6A76"/><text x="393" y="55" text-anchor="middle" class="svgadapter">R1</text><rect x="636" y="42" width="36" height="18" rx="2" fill="#7A8691"/><text x="654" y="55" text-anchor="middle" class="svgadapter">TSO</text><text x="578.0" y="55" text-anchor="middle" class="svgsmall">slot D to E</text><rect x="676" y="38" width="14" height="26" rx="2" fill="#2B333B"/><text x="683" y="55" text-anchor="middle" class="svgadapter">E</text><text x="700" y="47" class="svgsmall">R1: Read1 with the cell label and UMI</text><text x="700" y="63" class="svgsmall">TSO: template-switching oligo</text><line x1="54" y1="32" x2="54" y2="72" stroke="#2B333B" stroke-width="1.4"/><line x1="515.0" y1="32" x2="515.0" y2="72" stroke="#E69F00" stroke-width="2" stroke-dasharray="4 3"/><line x1="676" y1="32" x2="676" y2="72" stroke="#2B333B" stroke-width="1.4"/><text x="54" y="88" text-anchor="middle" class="svgsmall">cut at C</text><text x="365" y="88" text-anchor="middle" class="svgsmall">no cut at the real D</text><text x="515.0" y="88" text-anchor="middle" class="svgsmall" style="fill:#9A6A00">false D, at a D-like sequence</text><text x="676" y="88" text-anchor="middle" class="svgsmall">cut at E</text><text x="10" y="120" class="svglabel">The two S-reads skera writes; lima rejects both</text><rect x="54" y="132" width="460.0" height="24" rx="3" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.5"/><text x="284.5" y="148" text-anchor="middle" class="svgsmall">S-read 1, chimera: whole C to D molecule, real D, first part of D to E</text><rect x="516.0" y="132" width="160.0" height="24" rx="3" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.5"/><text x="595.5" y="148" text-anchor="middle" class="svgsmall">S-read 2, fragment</text><text x="700" y="141" class="svgsmall">lima passes 0.3% of chimeras</text><text x="700" y="157" class="svgsmall">and 0.0% of fragments</text><text x="10" y="184" class="svglabel">Our segmentation keeps both molecules</text><rect x="56" y="196" width="300" height="22" rx="3" fill="#E2E7EC" stroke="#2B333B"/><text x="206.0" y="211" text-anchor="middle" class="svgsmall">proper molecule</text><rect x="374" y="196" width="300" height="22" rx="3" fill="#E2E7EC" stroke="#2B333B"/><text x="524.0" y="211" text-anchor="middle" class="svgsmall">proper molecule</text><text x="10" y="244" class="svgsmall">On reads that cover the array's reverse complement (adapters Q to A) the picture is mirrored.</text><text x="10" y="260" class="svgsmall">The cut falls in the molecule after the real adapter skera did not cut at, in the direction of the read, and the fragment keeps the Read1 end.</text></svg>