<svg class="schematic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-label="How a TSO-TSO molecule forms a mirror array"><style>.svglabel{font:600 13px 'IBM Plex Sans',Arial,sans-serif;fill:#1B1F24}.svgsmall{font:12px 'IBM Plex Sans',Arial,sans-serif;fill:#5B636E}.svgadapter{font:600 11px 'IBM Plex Sans',Arial,sans-serif;fill:#FFFFFF}.svgpanel{font:600 14px 'IBM Plex Sans',Arial,sans-serif;fill:#1B1F24}</style><text x="10" y="17" class="svgpanel">a  Mechanism (schematic)</text><g transform="translate(0,34)"><text x="10" y="22" class="svglabel">Each position PCR puts the lower-index adapter on the Read1 end and the higher-index adapter on the TSO end:</text><rect x="40" y="34" width="120" height="22" rx="3" fill="#E2E7EC" stroke="#A7B1BB" stroke-width="1"/><text x="100.0" y="49" text-anchor="middle" class="svgsmall">Read1 ... insert ... TSO</text><rect x="24" y="32" width="14" height="26" rx="2" fill="#2B333B"/><text x="31" y="49" text-anchor="middle" class="svgadapter">G</text><rect x="162" y="32" width="14" height="26" rx="2" fill="#2B333B"/><text x="169" y="49" text-anchor="middle" class="svgadapter">H</text><text x="200" y="50" class="svgsmall">a proper molecule of slot G to H; adapters join only to the same letter, so arrays grow A, B, ..., H, Q</text><text x="10" y="96" class="svglabel">A TSO-TSO molecule is primed by the TSO primer at both ends and gets the higher-index adapter twice:</text><rect x="40" y="108" width="120" height="22" rx="3" fill="#F6D3BF" stroke="#A7B1BB" stroke-width="1"/><text x="100.0" y="123" text-anchor="middle" class="svgsmall">TSO ... insert ... TSO</text><rect x="24" y="106" width="14" height="26" rx="2" fill="#2B333B"/><text x="31" y="123" text-anchor="middle" class="svgadapter">H</text><rect x="162" y="106" width="14" height="26" rx="2" fill="#2B333B"/><text x="169" y="123" text-anchor="middle" class="svgadapter">H</text><text x="200" y="124" class="svgsmall">each H end then takes a slot H to Q molecule, so both halves run to Q</text><text x="10" y="158" class="svglabel">The read: a mirror junction (H' followed by H) with the TSO-TSO molecule at its centre</text><rect x="40" y="168" width="14" height="26" rx="2" fill="#2B333B"/><text x="47" y="185" text-anchor="middle" class="svgadapter">Q'</text><rect x="56" y="170" width="150" height="22" rx="3" fill="#E2E7EC" stroke="#A7B1BB"/><text x="131" y="185" text-anchor="middle" class="svgsmall">proper</text><rect x="208" y="168" width="14" height="26" rx="2" fill="#2B333B"/><text x="215" y="185" text-anchor="middle" class="svgadapter">H'</text><rect x="224" y="170" width="150" height="22" rx="3" fill="#F6D3BF" stroke="#A7B1BB"/><text x="299" y="185" text-anchor="middle" class="svgsmall">TSO-TSO</text><rect x="376" y="168" width="14" height="26" rx="2" fill="#2B333B"/><text x="383" y="185" text-anchor="middle" class="svgadapter">H</text><rect x="392" y="170" width="150" height="22" rx="3" fill="#E2E7EC" stroke="#A7B1BB"/><text x="467" y="185" text-anchor="middle" class="svgsmall">proper</text><rect x="544" y="168" width="14" height="26" rx="2" fill="#2B333B"/><text x="551" y="185" text-anchor="middle" class="svgadapter">Q</text></g></svg>